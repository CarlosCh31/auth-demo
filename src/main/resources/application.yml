server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  security:
    oauth2:
      client:
        provider:
          okta:
            issuer-uri: https://trial-8014635.okta.com/oauth2/default
        registration:
          okta:
            client-id: ${OKTA_CLIENT_ID}
            client-secret: ${OKTA_CLIENT_SECRET}
            scope: openid, profile, email

      resourceserver:
        jwt:
          issuer-uri: https://trial-8014635.okta.com/oauth2/default
          jwk-set-uri: https://trial-8014635.okta.com/oauth2/default/v1/keys
