server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

auth:
  issuer: ${AUTH_ISSUER}
  audience: ${AUTH_AUDIENCE}

spring:
  security:
    oauth2:
      client:
        provider:
          auth0:
            issuer-uri: ${AUTH_ISSUER}
        registration:
          auth0:
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            scope: openid, profile, email, read:r1, read:r2

      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER}